name: Skill Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@v4

      - name: Check every skill has evals
        run: |
          missing=0
          for skill_dir in skills/*/; do
            evals_file="${skill_dir}evals/evals.json"
            if [ ! -f "$evals_file" ]; then
              echo "Missing evals/evals.json: ${skill_dir}"
              missing=1
              continue
            fi
            count=$(python3 -c "import json; d=json.load(open('$evals_file')); print(len(d.get('evals', [])))")
            if [ "$count" -lt 2 ]; then
              echo "Too few evals in ${skill_dir} (found $count, need >=2)"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Every skill must have evals/evals.json with at least 2 test cases." >&2
            exit 1
          fi

      - name: List skills for matrix
        id: list
        run: |
          skills=$(python3 -c "
          import json, os
          skills = sorted(d for d in os.listdir('skills') if os.path.isdir(f'skills/{d}'))
          print(json.dumps(skills))
          ")
          echo "skills=$skills" >> $GITHUB_OUTPUT

  validate:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill: ${{ fromJson(needs.preflight.outputs.skills) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Validate ${{ matrix.skill }}
        uses: Flash-Brew-Digital/validate-skill@v1
        with:
          path: skills/${{ matrix.skill }}
          fail-on-warning: false
          validate-references: true

  evals:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-Qwen3-0.6B-Q4_K_M-v1

      - name: Run full evals (local model)
        env:
          UV_EXTRA_INDEX_URL: https://abetlen.github.io/llama-cpp-python/whl/cpu
        run: |
          uv run --with llama-cpp-python --with huggingface-hub \
            run_evals.py --local --simulate --fail-below 0.8
