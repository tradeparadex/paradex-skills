name: Skill Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate skill structure
        uses: Flash-Brew-Digital/validate-skill@v1
        with:
          path: skills/
          enforce-directories: false
          validate-references: true
          fail-on-warning: false

      - name: Check every skill has evals
        run: |
          missing=0
          for skill_dir in skills/*/; do
            evals_file="${skill_dir}evals/evals.json"
            if [ ! -f "$evals_file" ]; then
              echo "Missing evals/evals.json: ${skill_dir}"
              missing=1
              continue
            fi
            count=$(python3 -c "import json; d=json.load(open('$evals_file')); print(len(d.get('evals', [])))")
            if [ "$count" -lt 2 ]; then
              echo "Too few evals in ${skill_dir} (found $count, need >=2)"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "Every skill must have evals/evals.json with at least 2 test cases." >&2
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install eval dependencies
        run: |
          pip install huggingface-hub
          pip install llama-cpp-python \
            --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-Qwen3-0.6B-Q4_K_M-v1

      - name: Run full evals (local model)
        run: python run_evals.py --local --simulate --fail-below 0.8
