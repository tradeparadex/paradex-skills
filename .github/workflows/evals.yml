name: Skill Evals

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.list.outputs.skills }}
    steps:
      - uses: actions/checkout@v4

      - name: List skills for matrix
        id: list
        run: |
          skills=$(python3 -c "
          import json, os
          skills = sorted(d for d in os.listdir('skills') if os.path.isdir(f'skills/{d}'))
          print(json.dumps(skills))
          ")
          echo "skills=$skills" >> $GITHUB_OUTPUT

  validate:
    needs: preflight
    runs-on: ubuntu-latest
    strategy:
      matrix:
        skill: ${{ fromJson(needs.preflight.outputs.skills) }}
      fail-fast: false
    steps:
      - uses: actions/checkout@v4

      - name: Validate ${{ matrix.skill }}
        uses: Flash-Brew-Digital/validate-skill@v1
        with:
          path: skills/${{ matrix.skill }}
          fail-on-warning: false
          validate-references: true
          ignore-rules: name-match-directory

  evals:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-Qwen3-0.6B-Q4_K_M-v1

      - name: Run full evals (local model)
        run: uv run run_evals.py --local --simulate --fail-below 0.8
