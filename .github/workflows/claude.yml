name: Claude

# Responds to @claude mentions in issues and PR comments, running Claude
# Code on Amazon Bedrock. Authentication is keyless: AWS credentials are
# minted at run time via GitHub OIDC (no static AWS keys stored), and a
# scoped GitHub App token is generated per run.
#
# Required repo secrets (Settings -> Secrets and variables -> Actions):
#   AWS_ROLE_TO_ASSUME  ARN of the IAM role GitHub OIDC may assume (Bedrock-only perms)
#   APP_ID              GitHub App ID (the branded bot identity)
#   APP_PRIVATE_KEY     The GitHub App private key (.pem contents)
#
# See docs/ci-auth.md for the IAM trust policy, least-privilege Bedrock
# policy, and the GITHUB_TOKEN-vs-App-token tradeoff.

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write            # required for GitHub OIDC -> AWS STS

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]

jobs:
  claude:
    # Only run when a human actually mentions @claude (skips Claude's own comments).
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AWS_REGION: us-west-2
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0       # full history so Claude can diff the PR

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Claude Code on Bedrock
        uses: anthropics/claude-code-action@v1
        with:
          github_token: ${{ steps.app-token.outputs.token }}
          use_bedrock: "true"
          # Region-prefixed inference-profile id (required for Bedrock).
          claude_args: '--model us.anthropic.claude-sonnet-4-6 --max-turns 10'
